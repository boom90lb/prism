# The `conservative` profile of docs/risk_profile_schema.md §1, as a declared
# file. Tighten-only is the reference project's rule, and it is enforced here
# rather than in the engine: gross 0.5 against the certified pin of 1.0, the
# per-name cap left at the certified 0.10, and `min_regime_scale` at the
# ratified de-gross depth of docs/sizing_preregistration.md §3.
#
# What this file cannot say, because §3.7 has no class for it: the sleeve
# capital bands (equity 0.5-0.7, trend 0.2-0.3, crypto disabled). They are a
# composition policy over sleeves, not a constraint on one account's holdings,
# and `prism.live.risk_profile.INEXPRESSIBLE_CONTROLS` records that rather than
# dropping them. `whole_shares` is not a limit either: the quantity increment
# is the execution profile's `quantity_increment_default`.
name = "conservative"
min_account_status = "undetermined"
min_regime_scale = 0.5

[[limits]]
name = "max_gross"
class = "preference"
priority = 1
value = 0.5

[[limits]]
name = "max_name_weight"
class = "preference"
priority = 2
value = 0.10
