# The component book of the earnings-announcement replication registration
# (`registrations/2026-09-earnings.toml`; docs/earnings_design.md).
#
# One component: the announcement return (Chan, Jegadeesh and Lakonishok 1996) as
# Chen and Zimmermann's public series forms it. Each security carries its latest
# announcement's market-adjusted return over sessions d0-2 .. d0+1 for 126 sessions
# (six months) after it is known, and the book is re-formed every 21 sessions: a
# monthly decile long/short, like the public quintile portfolio re-formed monthly.
# The node reads the frozen point-in-time panel
# `data/frozen/earnings_v1/panel.parquet` (pinned by sha256; built by
# `prism.scripts.build_earnings_panel`, definitions in `prism.io.earnings_events`).
#
# Everything else is the fundamentals book's (`examples/fundamentals/control.toml`):
# the momentum control's eligibility screen, construction, costs and execution profile.

[strategy]
name = "earnings_monthly"
universe_index = "sp500"
combination = "position_space"
renormalize = false

[[strategy.components]]
id = "ear_monthly"
path = "prism.signal.earnings_node:EarningsAnnouncementNode"
weight = 1.0
horizon_bars = 21
update_every_bars = 21
valid_for_bars = 21
to_weights = "decile_long_short"

[strategy.components.params]
panel = "data/frozen/earnings_v1/panel.parquet"
panel_sha256 = "d4703a6cc1374e862d398df1a5bc4069e4e04f0ec1fc1fe9c81614a0fc3d701e"
max_age_sessions = 126
horizon_bars = 21

[strategy.components.to_weights_params]
decile = 0.10
max_gross = 1.0
max_symbol_abs_weight = 0.35

# The screen of the momentum control (`examples/characteristics/control.toml`), kept
# identical so every arm scores the same eligible cross-section as the promoted
# momentum book it will be combined with.
[strategy.eligibility]
min_price = 5.0
min_median_dollar_volume = 1000000.0
dollar_volume_window = 20
return_history_bars = 252
listing_seasoning_bars = 0
membership_required = true
exclude_asset_classes = []

[construction]
kind = "heuristic"
step_order = "construct_band_cap_participation"
max_gross = 1.0
max_symbol_abs_weight = 0.35

[construction.band]
mode = "closed_form"
gamma_risk = 1.0

[construction.participation]
max_participation = 0.05
statistic = "median"
window_bars = 20
floor_dollars = 0.0
base = "initial_capital"

[construction.spread]
mode = "bucket"

[policy]
profile = "examples/reference/profiles/experiment_v1.toml"
costs = "examples/reference/costs/retail_v1.toml"
execution = "examples/reference/profiles/execution_alpaca.toml"
monitoring = "examples/reference/policies/monitoring.toml"
recovery = "examples/reference/policies/recovery.toml"
