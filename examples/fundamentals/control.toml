# The component book of the fundamentals registration
# (`registrations/2026-09-fundamentals.toml`; docs/fundamentals_design.md).
#
# Six published accounting characteristics, each a
# `prism.signal.fundamental_node:FundamentalCharacteristicNode` reading the frozen
# point-in-time panel `data/frozen/fundamentals_v1/panel.parquet` (pinned by sha256;
# built by `prism.scripts.build_fundamental_panel`, definitions in
# `prism.io.fundamental_panel`). Every arm of the registration runs this book and
# differs only in the `[arms.components]` weights: one characteristic at 1.0, the rest
# at 0.0. A component at weight zero contributes nothing to the composed target
# (position-space sum, `renormalize = false`) and nothing to gross.
#
# Everything else is the momentum control's (`examples/characteristics/control.toml`):
# decile long/short, monthly decisions, the same eligibility screen, construction,
# costs and execution profile. The weights below make this file, run alone, the
# book-to-market arm.

[strategy]
name = "fundamentals_control"
universe_index = "sp500"
combination = "position_space"
renormalize = false

[[strategy.components]]
id = "be_me"
path = "prism.signal.fundamental_node:FundamentalCharacteristicNode"
weight = 1.0
horizon_bars = 21
update_every_bars = 21
valid_for_bars = 21
to_weights = "decile_long_short"

[strategy.components.params]
characteristic = "be_me"
panel = "data/frozen/fundamentals_v1/panel.parquet"
panel_sha256 = "06ea92de10b1e2e9f0106c795b7d0b8ddac1a0dc62ef6a929ffc404ed7415df3"
horizon_bars = 21

[strategy.components.to_weights_params]
decile = 0.10
max_gross = 1.0
max_symbol_abs_weight = 0.35

[[strategy.components]]
id = "gp_at"
path = "prism.signal.fundamental_node:FundamentalCharacteristicNode"
