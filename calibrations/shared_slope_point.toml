# The point arm's calibration (engine specification §3.4, decision D6).
#
# `confidence` is absent, which IS the declaration: the lower and upper endpoints both
# equal `theta_shrunk`, and §3.7's return term reduces to `theta_shrunk * s`. The
# uncertainty arm's file, `shared_slope_p80.toml`, differs from this one in that key and
# in nothing else, which is what keeps the two arms' excluded folds, block counts and
# estimation-failure behaviour identical and the comparison same-sample (D6).
#
# Every value here is fixed before the run. Tuning one after seeing a result would make
# the arm a new configuration with its own place in the trial budget, not an adjustment.

kind = "shared_slope"
standardize = "rank_normal"
weighting = "per_date_equal"
shrink_pseudo_periods = 12.0
expected_sign = "positive"
uncertainty = "time_block_bootstrap"
block_scheme = "circular_moving"
block_periods = 3
n_resamples = 2000
seed = 20260906
min_training_periods = 12
min_blocks = 4
inner_oos_required = false
executable_return = "open_to_open"
label_distributions = "credited"

# The horizon volatility the label, the coefficient vector `a`, and the risk snapshot must
# all agree on. `scaling` must equal the risk model file's `scaling`, or `mu` is not
# commensurable with the variance term of §3.7 and the run is refused.
[sigma_h]
estimator = "ewma_daily"
window_bars = 63
scaling = "per_bar_times_h"
