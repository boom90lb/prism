# ------------------------------------------------------------ SPEC §4 criteria, per arm
[criteria]
publication_bar_t = 3.0
publication_bar_min_years = 20.0
post_publication_min_years = 10.0
pre_publication_haircut = 0.4
# Contract minimum; a negative daily correlation is also recorded as a direction mismatch.
fidelity_floor = 0.5
# Hurdle: in-house books earn nothing on cash (retail_v1.toml cash_income_bps_annual =
# 0.0), so an arm must out-earn T-bills at the volatility it can run at: the 12%
# target, or twice its own unscaled volatility if the Reg T 2x gross ceiling binds
# first. hurdle Sharpe = rf / min(target_vol, max_scale x own vol).
target_vol = 0.12
max_scale = 2.0
hurdle_window_sessions = 252
sessions_per_year = 252
# The cash series is the vol-momentum read's pinned French file (202607 CRSP vintage).
cash_url = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_daily_CSV.zip"
cash_sha256 = "1916d331c2c51d2aee3d00215897d2b8e5995cb387f1f4569ba46bff5fb049a8"

# ------------------------------------------------------------ the pinned combination
# SPEC §4, Combinations, "on its own replication criteria". Parts: every arm above that
# passes criteria 1 and 2 (which read public data and tracking, never in-house
# performance), plus the promoted volatility-scaled momentum (vol_momentum_v1). At
# least three parts, momentum among them, or the combination is not evaluated.
[combination]
min_parts = 3
momentum_part = "vol_momentum"
# Each fundamental part is scaled to the target by the rule the momentum part already
# carries (126-session volatility, re-set every 21 sessions, scale capped at 2); the
# momentum part enters as promoted. Equal weights over parts at a common volatility is
# equal risk. The average is scaled to the target again, with the scale capped so that
# total gross (sum of weight x part scale x part gross) stays within 2.
weights = "equal"
target_vol = 0.12
lookback_sessions = 126
refresh_sessions = 21
part_max_scale = 2.0
max_total_gross = 2.0
scale_change_cost_bps = 10.0
# The prior is the public combination's Sharpe from the latest publication among the
# parts to the public series' common end, if that spans ten years or more; else 0.4 x
# its Sharpe over the whole common window. Costs are the parts' own, summed with no
# netting credit (conservative).
# The momentum part is the promoted configuration's own committed record: its in-house
# scaled net returns and charged costs, and its public reference (French momentum
# scaled by the same rule, gross), as `vol_momentum_replication` wrote them.
momentum_series = "results/2026-09-vol-momentum/series.csv"
momentum_series_sha256 = "ded96a7226e7ae70c71422741a46a3ec1620442dbbb0c2e38aae64f49db37395"
momentum_publication = "2015-04"

[bootstrap]
block_bars = 42
n_resamples = 2000
seed = 20260925
confidence = 0.95

# ------------------------------------------------------------ forward kill rule
# Runs from this registration's commit, and after any promotion, on the arms and the
# combination run forward on sessions from 2026-09-24 (the forward_v1 geometry). The
# first read is at >= 126 forward sessions, then every 63. Any one condition kills.
[kill]
first_read_min_sessions = 126
read_every_sessions = 63
max_drawdown = 0.25
min_forward_fidelity = 0.5
