jkp_url = "https://jkpfactors-data.s3.amazonaws.com/public/%5Busa%5D_%5Bat_gr1%5D_%5Bdaily%5D_%5Bvw_cap%5D.zip"
jkp_sha256 = "67cd2937812aa13138143c60733645b9b228b96aff8a5f50c7487c72e7a2bc15"

