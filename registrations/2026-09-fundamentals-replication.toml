# Fundamentals, replication route: the criteria (SPEC.md §4; docs/fundamentals_design.md).
#
# Companion to `registrations/2026-09-fundamentals.toml`, which declares the six
# in-house arms. This file pins everything the replication read
# (`research/scripts/fundamentals_replication.py`) uses to decide them: the public
# reference series and their publication dates, the four per-arm criteria, the pinned
# combination (SPEC §4, Combinations), and the forward kill rules. A changed series,
# date, floor, hurdle, part or weight is a new registration.
id = "2026-09-fundamentals-replication"
created = 2026-09-24
selection_set = "fundamentals_v1"
route = "replication"
engine_registration = "registrations/2026-09-fundamentals.toml"
# The engine arms' records, as `research.scripts.registered_read` writes them.
engine_read = "results/2026-09-fundamentals"
# The combination is one more evaluated configuration: its row goes to its own log so
# the engine's six-arm budget is untouched.
combination_trial_log = "trials/fundamentals_v1_combination.jsonl"

# ------------------------------------------------------------ public reference series
# JKP daily US factor returns, capped value weight, direction-adjusted by JKP (the
# `direction` column: +1 for be_me, gp_at, niq_su; -1 for at_gr1, oaccruals_at,
# chcsho_12m, matching the node's published signs). Files as fetched 2026-09-24;
# only schemas and date ranges were inspected before this registration.
[[characteristic]]
id = "be_me"
source = "Fama, E. and French, K. (1992). The cross-section of expected stock returns. Journal of Finance 47(2)."
publication = "1992-06"
jkp_url = "https://jkpfactors-data.s3.amazonaws.com/public/%5Busa%5D_%5Bbe_me%5D_%5Bdaily%5D_%5Bvw_cap%5D.zip"
jkp_sha256 = "fed24dda1e3ff8f4b8835bc24c3379d9a93a2e688e1fdfd1acb5b772f646af56"

[[characteristic]]
id = "gp_at"
source = "Novy-Marx, R. (2013). The other side of value: The gross profitability premium. Journal of Financial Economics 108(1)."
