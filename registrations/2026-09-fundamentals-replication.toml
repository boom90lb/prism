jkp_sha256 = "9e941c4bb01a0cda481889de766273b6f118ca7e2148aea59b03a766b407e30b"

[[characteristic]]
id = "at_gr1"
source = "Cooper, M., Gulen, H. and Schill, M. (2008). Asset growth and the cross-section of stock returns. Journal of Finance 63(4)."
