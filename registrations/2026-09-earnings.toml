# Earnings-announcement return, replication route (SPEC.md §4; docs/earnings_design.md).
#
# One published characteristic, the announcement return of Chan, Jegadeesh and
# Lakonishok (1996), run as one arm: the monthly decile long/short book of
# `examples/earnings/monthly.toml`. Same frozen dataset, fold geometry, cost stack,
# execution profile, accounting engine, eligibility screen and capital as the
# fundamentals arms and the momentum control, so the arm is the book the promoted,
# vol-scaled momentum configuration would be combined with.
#
# This file declares the in-house run only. The replication criteria (public reference
# series, publication date, fidelity floor, hurdle, the combination and the forward
# kill rules) are in `registrations/2026-09-earnings-replication.toml` and are read by
# `research/scripts/earnings_replication.py`, which the promotion rule's callback names.
# The daily event-time arms are a separate discovery-route registration
# (`registrations/2026-09-earnings-daily.toml`). Adding an arm, a window or a threshold
# after seeing a result is a new registration, never an edit of any of these files.
id = "2026-09-earnings"
created = 2026-09-24
selection_set = "earnings_v1"
strict = true
# One attempt is one `arm_id`. One arm, one attempt, no reserve. A retry after a crash
# carries kind = "retry" and spends none.
trial_budget = 1

# The node emits the announcement return, whose published direction is positive: a high
# return is the long leg.
[[components]]
id = "ear_monthly"
path = "prism.signal.earnings_node:EarningsAnnouncementNode"
expected_sign = "positive"
scoring_basis = "price"

# Restated from `registrations/2026-09-characteristics.toml`: every arm is heuristic,
# so no calibration is read, and the risk model acts only through the experiment
# profile's variance-budget limit.
[shared]
risk_model = "examples/reference/risk/factor_diagonal.toml"
calibration_family = "calibrations/shared_slope_point.toml"
standardize = "rank_normal"
weighting = "per_date_equal"
shrink_pseudo_periods = 12.0
block_periods = 3
min_training_periods = 12
min_blocks = 4
risk_aversion = 0.0
eps = 1.0e-8
max_at_cap_fraction = 0.35
eligibility_exit = "reduce_only"

# The one arm. Announcement return (Chan, Jegadeesh and Lakonishok 1996).
[[arms]]
id = "ear_monthly"
profile = "examples/reference/profiles/experiment_v1.toml"

[arms.construction]
kind = "heuristic"
to_weights = "decile_long_short"
decile = 0.10

[arms.components]
ear_monthly = 1.0

# Sample and fold geometry: the recorded B1 evidence's own, as in the fundamentals
# registration. The node needs one bar of history; `warmup_bars` stays at the momentum
# book's 273 so the arm scores exactly the momentum control's decision bars.
[sample]
history_start = 2020-01-02
first_decision = 2021-03-30
last_decision = 2026-06-12
warmup_bars = 273
decision_offset_minutes = 0

[folds]
table = "folds/demotion_b1.toml"

[frozen]
freeze_record = "data/frozen/earnings_v1.freeze.json"
executable_return = "open_to_open"
cost_stack = "examples/reference/costs/retail_v1.toml"
execution_profile = "examples/reference/profiles/execution_alpaca.toml"
accounting_engine = "canonical"
visibility_mode = "research_vintage"
fold_portfolio = "carry"
cost_refresh = "fold"
capital_scenarios = [100000]
capital_unit = "usd_marked_equity_at_first_decision"

[evidence]
robust_dsr_threshold = 0.95
min_obs = 20

[sharpe_bootstrap]
frequency = "daily"
block_bars = 42
n_resamples = 2000
seed = 20260926
scheme = "circular"
paired = true

# The set closes when the one declared arm has run. An arm the replication read finds
# contradicted in-house (criterion 4) is dead; forward kill rules live in the
# replication registration.
[stop_rule]
kind = "structured"
min_obs = 20
note = "The set closes when the declared arm has run; no arm may be added. Kill: SPEC §4 replication criterion 4, and the forward kill rules of registrations/2026-09-earnings-replication.toml."

# Replication route (SPEC §4): the arm promotes on its own four criteria, and the pinned
# combination on the Combinations criteria, both computed by the callback from public
# series and this arm's record.
[promotion_rule]
kind = "structured"
callback = "research.scripts.earnings_replication:promotion_outcome"
note = "SPEC §4 replication route, for the arm and the pinned combination; parameters in registrations/2026-09-earnings-replication.toml."

[benchmark]
cash_series = "tbill_3m"
cash_source = "FRED:DTB3"
cash_conversion = "discount_to_bond_equivalent_then_daily_accrual"
day_count = "act/365"
control = "examples/earnings/monthly.toml"
