# The breadth set (SPEC.md §5.2; docs/breadth_design.md).
#
# The frozen B1 momentum book on three indices of one frozen dataset: the S&P
# 500 (the control, the certified universe), the exclusive S&P MidCap 400, and
# their union. Arms differ only in `universe_index`. Same-sample: it can kill
# and cannot promote.
id = "2026-09-breadth"
created = 2026-09-23
selection_set = "breadth_v1"
strict = true
trial_budget = 3

[[components]]
id = "momentum"
path = "prism.signal.momentum_node:MomentumSignalNode"
expected_sign = "positive"
scoring_basis = "price"

[shared]
risk_model = "examples/reference/risk/factor_diagonal.toml"
calibration_family = "calibrations/shared_slope_point.toml"
standardize = "rank_normal"
weighting = "per_date_equal"
shrink_pseudo_periods = 12.0
block_periods = 3
min_training_periods = 12
min_blocks = 4
risk_aversion = 0.0
eps = 1.0e-8
max_at_cap_fraction = 0.35
eligibility_exit = "reduce_only"

[[arms]]
id = "sp500_control"
profile = "examples/reference/profiles/experiment_v1.toml"
universe_index = "sp500"

[arms.construction]
kind = "heuristic"
to_weights = "decile_long_short"
decile = 0.10

[[arms]]
id = "sp400_only"
profile = "examples/reference/profiles/experiment_v1.toml"
universe_index = "sp400"

[arms.construction]
kind = "heuristic"
to_weights = "decile_long_short"
decile = 0.10

[[arms]]
id = "sp900_union"
profile = "examples/reference/profiles/experiment_v1.toml"
universe_index = "sp900"

[arms.construction]
kind = "heuristic"
to_weights = "decile_long_short"
decile = 0.10

[sample]
history_start = 2020-01-02
first_decision = 2021-03-30
last_decision = 2026-06-12
warmup_bars = 273
decision_offset_minutes = 0

[folds]
table = "folds/demotion_b1.toml"

[frozen]
freeze_record = "data/frozen/breadth_v1.freeze.json"
executable_return = "open_to_open"
cost_stack = "examples/reference/costs/retail_v1.toml"
execution_profile = "examples/reference/profiles/execution_alpaca.toml"
accounting_engine = "canonical"
visibility_mode = "research_vintage"
fold_portfolio = "carry"
cost_refresh = "fold"
capital_scenarios = [100000]
capital_unit = "usd_marked_equity_at_first_decision"

[evidence]
robust_dsr_threshold = 0.95
min_obs = 20

[sharpe_bootstrap]
frequency = "daily"
block_bars = 42
n_resamples = 2000
seed = 20260923
scheme = "circular"
paired = true

[stop_rule]
kind = "structured"
min_obs = 20
note = "The set closes when the three declared arms have run. An arm whose paired interval against the control lies entirely below zero is killed."

[promotion_rule]
kind = "none"
note = "Same-sample breadth read; no arm promotes. Not cell C1 of docs/replication_preregistration.md, which is gated on a survivorship-complete panel."

[benchmark]
cash_series = "tbill_3m"
cash_source = "FRED:DTB3"
cash_conversion = "discount_to_bond_equivalent_then_daily_accrual"
day_count = "act/365"
control = "examples/breadth/control.toml"
